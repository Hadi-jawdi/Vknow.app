{% include 'includes/base.html'%}
{% include 'includes/header.html'%}



{% block content %}
<br>
 <h1>ALl lessons  are here</h1>
 <div class="row gy-4 my-2">
    {% for lesson in lessons %}
      <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="100">
        <div class="features-item">
          <img src="{{ lesson.lesson_banner.url }}" alt="{{ lesson.lesson_name }}" class="img-fluid">
          <i class="bi bi-eye" style="color: #ffbb2c;"></i>
          <h3>
            <a" class="stretched-link">{{ lesson.lesson_name }}</a>
          </h3>
          <p>{{ lesson.lesson_description|truncatewords:20 }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
  
{% endblock content %}


{% include 'includes/footer.html'%}
