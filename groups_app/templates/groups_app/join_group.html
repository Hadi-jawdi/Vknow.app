{% include 'includes/header.html' %}
<div class="container mt-5 shadow p-4 rounded">
  <h2>پیوستن به گروه</h2>
  {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">کد گروه</label>
      <input type="text" name="code" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg">پیوستن</button>
  </form>
</div>
{% include 'includes/footer.html' %}
