{% include 'includes/base.html' %}

{% block content %}
<style>
  body {
    background-color: #f8f9fc;
  }

  .register-wrapper {
    min-height: 100vh;
  }

  .register-card {
    border-radius: 16px;
  }

  .form-control {
    border-radius: 10px;
    padding: 10px 12px;
  }

  .btn-register {
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
  }

  @media (max-width: 576px) {
    .register-card {
      padding: 1.5rem !important;
    }

    h3 {
      font-size: 20px;
    }
  }
</style>

<div class="container register-wrapper d-flex align-items-center justify-content-center py-4">
  <div class="col-12 col-sm-10 col-md-7 col-lg-6">

    <div class="card shadow border-0 register-card p-4">

      <!-- Title -->
      <div class="text-center mb-4">
        <h3>Vknow</h3>
        <p class="text-muted small mb-0">
          لطفاً اطلاعات خود را برای ثبت‌نام وارد کنید
        </p>
      </div>
      

      <!-- Already have account -->
      <div class="text-center mb-4 small">
        قبلاً ثبت‌نام کرده‌اید؟
        <a href="{% url 'account_app:login_user' %}" class="fw-bold text-primary">
          وارد شوید
        </a>
      </div>

      <!-- Form -->
      <form action="{% url 'account_app:register_user' %}" method="post">
        {% csrf_token %}

        <div class="mb-3">
          {{ form.as_p }}
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-primary btn-register" type="submit">
            ثبت‌نام
          </button>
        </div>
      </form>

    </div>

  </div>
</div>

{% include 'includes/footer.html' %}
{% endblock content %}
