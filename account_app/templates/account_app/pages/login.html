{% include 'includes/base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">

          <h3 class="text-center mb-3">ورود به حساب کاربری</h3>
          <p class="text-center text-muted mb-4">
            خوش آمدید! لطفاً اطلاعات خود را وارد کنید
          </p>

          <p class="text-center">
            حساب کاربری ندارید؟
            <a class="text-danger fw-bold" href="{% url 'account_app:register_user' %}">
              ثبت‌نام کنید
            </a>
          </p>

          {% if error %}
            <div class="alert alert-danger text-center mt-3">
              {{ error }}
            </div>
          {% endif %}

          <form action="{% url 'account_app:login_user' %}" method="post" class="mt-4">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">نام کاربری</label>
              <input
                type="text"
                class="form-control"
                name="username"
                placeholder="نام کاربری خود را وارد کنید"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">رمز عبور</label>
              <input
                type="password"
                class="form-control"
                name="password"
                placeholder="رمز عبور خود را وارد کنید"
                required
              />
            </div>

            <div class="d-grid">
              <button class="btn btn-success btn-lg" type="submit">
                ورود
              </button>
            </div>
          </form>

          <div class="text-center mt-3">
            <a href="#" class="text-decoration-none text-danger">
              رمز عبور را فراموش کرده‌اید؟
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

{% include 'includes/footer.html' %}
{% endblock content %}
