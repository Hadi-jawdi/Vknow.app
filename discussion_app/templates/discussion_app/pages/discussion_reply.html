{% include 'includes/header.html'%}


{% block content %}
<div class="container shadow shadow-lg my-5">

<h2>پاسخ به: {{ post.title }}</h2>
{% if parent %}
<p>در پاسخ به: {{ parent.content }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="content" class="form-label">متن پاسخ</label>
        <textarea class="form-control" name="content" id="content" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-success my-2">ارسال پاسخ</button>
</form>
</div>

{% endblock %}

{% include 'includes/footer.html'%}
