{% load static %} {% include 'includes/header.html' %}
<!--   custom css for discussion_app-->
<link rel="stylesheet" href="{% static 'discussion_app/css/style.css' %}" />
{% block content %}

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <!-- Header -->
      <div class="mb-4">
        <h4 class="fw-bold mb-1">ایجاد پست جدید</h4>
        <p class="text-muted small mb-0">
          سوال یا نکته درسی خود را با دیگران به اشتراک بگذارید
        </p>
      </div>

      <!-- Composer -->
      <div class="post_div p-3 p-md-4 shadow shadow-lg">
        <form method="post" id="postForm">
          {% csrf_token %}

          <!-- Title -->
          <div class="mb-3 shadow shadow-md">
            <input
              type="text"
              class="form-control post-title"
              name="title"
              placeholder="عنوان پست"
              required
            />
          </div>

          <!-- Editor -->
          <div class="mb-3">
            <div id="editor"></div>
            <input type="hidden" name="content" id="hiddenContent" />
            <div class="text-danger small mt-2 d-none" id="editorError">
              لطفاً متن پست را وارد کنید
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between align-items-center mt-4">
            <a
              href="{% url 'discussion_app:list' %}"
              class="text-muted small text-decoration-none"
            >
              بازگشت
            </a>

            <button type="submit" class="btn btn-submit px-4">انتشار</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Quill CDN -->
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<!-- custome js codes-->
<script src="{% static 'discussion_app/js/editor.js' %}"></script>


{% endblock content %}
